name: halaqat
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  easy_localization: ^3.0.8
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.5
  file_picker: ^12.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  flutter_file_dialog: ^3.0.3
  permission_handler: ^11.3.1
  provider: ^6.1.5+1
  firebase_auth: ^6.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # ensures compatibility with adaptive icon requirements